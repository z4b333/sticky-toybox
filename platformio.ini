; Toybox — games and small tools for the Seeed reTerminal Sticky
; Board: ESP32-S3R8 (8MB PSRAM, 32MB flash), 3.97" 800x480 SSD1677 e-paper, GT911 touch
;
; Flash:  pio run -t upload    (put device in bootloader mode if needed:
;         hold BOOT-equivalent / use the vendor's flashing procedure over USB-C)
; Serial: pio device monitor -b 115200

[env:sticky]
; pioarduino fork of the ESP32 platform: Arduino core 3.x (needed for the
; ledcAttach/ledcWriteTone API used by the buzzer) with packages hosted on GitHub.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -std=gnu++17
  -O2
build_unflags =
  -std=gnu++11
board_build.flash_mode = qio
; App is well under the default partition size; the stock 32MB flash is fine
; with the default 8MB-image partition table shipped by the devkit board def.
board_upload.flash_size = 16MB
; Single app slot + 11.9 MB LittleFS: the downloadable font packs live on the
; filesystem, and this firmware has no OTA to spend a second slot on.
board_build.partitions = partitions_toybox.csv
; Everything portable lives in toybox-core/ and is pulled in as a library, the
; same way the CrossPoint port will pull it. src/ is only what makes this a
; firmware: the panel driver, touch, the buzzer and the loop.
lib_deps =
  Toybox=symlink://toybox-core
