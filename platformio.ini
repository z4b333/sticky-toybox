; Toybox — games and small tools for the Seeed reTerminal Sticky
; Board: ESP32-S3R8 (8MB PSRAM, 32MB flash), 3.97" 800x480 SSD1677 e-paper, GT911 touch
;
; Flash:  pio run -t upload    (put device in bootloader mode if needed:
;         hold BOOT-equivalent / use the vendor's flashing procedure over USB-C)
; Serial: pio device monitor -b 115200

[env:sticky]
; pioarduino fork of the ESP32 platform: Arduino core 3.x (needed for the
; ledcAttach/ledcWriteTone API used by the buzzer) with packages hosted on GitHub.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  ; Tells the Arduino core there is PSRAM to find, and lets ps_malloc work.
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -std=gnu++17
  -O2
; Stamps every build with the commit it came from. The service screen shows it
; and the flasher page prints it beside the install button, so "which firmware
; is this" has an answer at both ends.
extra_scripts = pre:tools/version.py
build_unflags =
  -std=gnu++11
; DIO, not QIO. This module is an ESP32-S3R8: the octal PSRAM shares the extra
; SPI data lines, so quad flash reads come back as garbage. The symptom is not
; subtle once you have seen it -- the ROM parses the header (it prints the mode
; it is about to switch to), switches, then fails to load the second-stage
; bootloader and watchdog-resets forever:
;
;   rst:0x7 (TG0WDT_SYS_RST)
;   mode:QIO, clock div:1
;   load:0x3fce2820,len:0x1150
;   ets_loader.c 78
;
; qio was in this file from the first commit, taken from the datasheet rather
; than from a device that had booted.
board_build.flash_mode = dio

; The 8 MB of PSRAM, configured at last.
;
; It sat unused since bring-up because nothing needed it -- and then four
; things did, in a row: the file list on the stack, the page buffer, the
; inflate window, and the SD mount inside the file portal. Each was fixable
; by hand and each fix traded one scarcity for another, on a chip carrying
; 8 MB nobody was allowed to touch.
;
; memory_type is the pair, and BOTH halves matter: `dio` is the flash mode
; above (an S3R8's octal PSRAM shares the extra SPI data lines, so quad flash
; reads come back as garbage), and `opi` is the PSRAM itself, which on this
; part is octal. dio_qspi or qio_opi would each be a boot loop of the kind
; documented above. CrossPoint runs the same module this way.
;
; If this build ever fails to come up, the recovery is the same as it has
; always been: BOOT button and reflash over USB. The ROM loader does not care
; what this file says.
board_build.arduino.memory_type = dio_opi
board_build.psram_type = opi
; App is well under the default partition size; the stock 32MB flash is fine
; with the default 8MB-image partition table shipped by the devkit board def.
board_upload.flash_size = 16MB
; Single app slot + 11.9 MB LittleFS: the downloadable font packs live on the
; filesystem, and this firmware has no OTA to spend a second slot on.
board_build.partitions = partitions_toybox.csv
; Everything portable lives in toybox-core/ and is pulled in as a library, the
; same way the CrossPoint port will pull it. src/ is only what makes this a
; firmware: the panel driver, touch, the buzzer and the loop.
lib_deps =
  Toybox=symlink://toybox-core
